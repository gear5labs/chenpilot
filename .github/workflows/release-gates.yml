name: Release Gates

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
    paths:
      - "src/Gateway/**"
      - "src/scripts/testWebhookIdempotency.ts"
      - "src/config/Datasource.ts"
      - ".github/workflows/release-gates.yml"

jobs:
  backend-health:
    name: Backend compiler and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: chenpilot_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compiler gate
        run: npm run build:check

      - name: Backend unit tests
        run: npm test -- --runInBand

      - name: Webhook idempotency integration tests
        run: npm test -- --testPathPattern="webhookIdempotency.integration" --runInBand
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: test
          DATABASE_PASSWORD: test
          DATABASE_NAME: chenpilot_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379

  sdk-health:
    name: SDK drift and package health
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/sdk/package-lock.json

      - name: Install SDK dependencies
        run: npm ci
        working-directory: packages/sdk

      - name: SDK compiler gate
        run: npm run type-check
        working-directory: packages/sdk

      - name: SDK tests
        run: npm test -- --runInBand
        working-directory: packages/sdk

      - name: SDK artifact dry run
        run: npm pack --dry-run
        working-directory: packages/sdk

  contract-health:
    name: Soroban contract compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cargo check
        run: cargo check --manifest-path contracts/Cargo.toml --workspace

      - name: Contract tests
        run: cargo test --manifest-path contracts/Cargo.toml --workspace

  storage-compat:
    name: Storage schema compatibility gate
    runs-on: ubuntu-latest
    # Run in parallel with contract-health; both must pass before merge
    needs: []

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── Step 1: Extract schemas from the proposed source tree ───────────────
      - name: Extract proposed storage schemas
        run: npm run storage:extract-schemas -- --out-dir /tmp/proposed-schemas
        # Produces /tmp/proposed-schemas/<contract>.schema.json for every
        # workspace member

      # ── Step 2: Compare each proposed schema against the committed baseline ─
      - name: Compare proposed schemas against baseline
        id: schema_compare
        run: |
          set -euo pipefail
          FAILURES=0
          mkdir -p /tmp/schema-reports
          for BASELINE in contracts/schemas/*.schema.json; do
            CONTRACT=$(basename "$BASELINE" .schema.json)
            PROPOSED="/tmp/proposed-schemas/${CONTRACT}.schema.json"

            if [ ! -f "$PROPOSED" ]; then
              echo "WARN: no proposed schema for $CONTRACT — skipping"
              continue
            fi

            MIGRATIONS=""
            if [ -f "contracts/migrations/${CONTRACT}.migrations.json" ]; then
              MIGRATIONS="--migrations contracts/migrations/${CONTRACT}.migrations.json"
            fi

            REPORT="/tmp/schema-reports/${CONTRACT}.report.json"
            set +e
            npx ts-node scripts/compare-storage-schemas.ts \
              --baseline "$BASELINE" \
              --proposed "$PROPOSED" \
              $MIGRATIONS \
              --output "$REPORT"
            EXIT=$?
            set -e

            if [ $EXIT -eq 1 ]; then
              echo "::error::Storage schema BREAKING change detected in $CONTRACT"
              FAILURES=$((FAILURES + 1))
            elif [ $EXIT -eq 2 ]; then
              echo "::warning::Storage schema MIGRATION_REQUIRED in $CONTRACT — ensure migration records are present"
            fi
          done

          if [ $FAILURES -gt 0 ]; then
            echo "::error::$FAILURES contract(s) have breaking storage schema changes. Upgrade blocked."
            exit 1
          fi

      # ── Step 3: Simulate upgrade against test snapshots ────────────────────
      - name: Simulate upgrade against state snapshots
        run: |
          npx ts-node scripts/simulate-upgrade.ts \
            --all \
            --schemas-dir /tmp/proposed-schemas \
            --snapshots-root contracts
        # Non-zero exit if any FAIL; warnings (WARN) are non-fatal

      # ── Step 4: Validate release manifest (if present) ─────────────────────
      - name: Validate release manifest
        if: hashFiles('release-manifest.json') != ''
        run: |
          npx ts-node scripts/validate-release-manifest.ts \
            --manifest release-manifest.json \
            --baseline-schemas-dir contracts/schemas \
            --output /tmp/schema-reports/manifest-validation.json
        # Fails (exit 1) if any contract has BREAKING changes or uncovered
        # MIGRATION_REQUIRED changes

      # ── Step 5: Run schema comparator unit tests ───────────────────────────
      - name: Schema comparator unit tests
        run: npm run test:storage -- --no-coverage

      # ── Step 5: Upload reports as artifacts ────────────────────────────────
      - name: Upload schema comparison reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-schema-reports
          path: /tmp/schema-reports/
          retention-days: 14

  root-artifact-health:
    name: Backend artifact integrity
    runs-on: ubuntu-latest
    needs: backend-health

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production artifact
        run: npm run build

      - name: Package dry run
        run: npm pack --dry-run
