name: Test Separation - Unit and Integration

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "jest.unit.config.js"
      - "jest.integration.config.js"
      - ".github/workflows/test-separation.yml"

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: coverage/
          retention-days: 30

  integration-tests:
    name: Integration Tests (Service-Backed)
    runs-on: ubuntu-latest

    # Prerequisites: PostgreSQL and Redis services required
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: chenpilot_test
        options: >
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests (requires PostgreSQL and Redis)
        run: npm run test:integration
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: test
          DATABASE_PASSWORD: test
          DATABASE_NAME: chenpilot_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: test
          DB_PASSWORD: test
          DB_NAME: chenpilot_test

      - name: Upload integration test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-diagnostics
          path: coverage/
          retention-days: 30
        continue-on-error: true

  test-summary:
    name: Test Summary and Visibility
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download unit test artifacts
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: unit-test-results
          path: unit-results/
        continue-on-error: true

      - name: Download integration test artifacts
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: integration-test-results
          path: integration-results/
        continue-on-error: true

      - name: Report test results
        if: always()
        run: |
          echo "## Test Execution Summary"
          echo ""
          echo "### Unit Tests"
          if [ -d "unit-results" ] && [ "$(ls -A unit-results)" ]; then
            echo "✅ Unit tests passed"
          else
            echo "⚠️ Unit tests did not run or were skipped"
          fi
          echo ""
          echo "### Integration Tests"
          if [ -d "integration-results" ] && [ "$(ls -A integration-results)" ]; then
            echo "✅ Integration tests passed (service-backed, requires PostgreSQL and Redis)"
          else
            echo "⚠️ Integration tests did not run or were skipped"
          fi
          echo ""
          echo "### Prerequisites Met:"
          echo "- Unit tests: No external services required"
          echo "- Integration tests: PostgreSQL 15 and Redis 7 required"
